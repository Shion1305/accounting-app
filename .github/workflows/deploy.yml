name: Deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        required: true
        options: [dev, stg, prd]
  release:
    types: [published, released]

permissions:
  contents: read

jobs:
  target:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev' && !github.event.deleted) ||
      (github.event_name == 'release' && !github.event.release.draft &&
        ((github.event.action == 'published' && github.event.release.prerelease) ||
         (github.event.action == 'released' && !github.event.release.prerelease)))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.target.outputs.environment }}
    steps:
      - id: target
        env:
          TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event_name == 'push' && 'dev' || github.event.release.prerelease && 'stg' || 'prd' }}
        run: echo "environment=$TARGET_ENV" >> "$GITHUB_OUTPUT"

  validate:
    needs: target
    if: needs.target.outputs.environment != ''
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: [target, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ needs.target.outputs.environment }}
      url: ${{ vars.APP_ORIGIN }}
    concurrency:
      group: cloudflare-${{ needs.target.outputs.environment }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_environment: ${{ needs.target.outputs.environment }}
      CLOUDFLARE_ACCOUNT_ID: "0350bf22d3fd4ab2fd9283c6ce8b91dd"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      EMAIL_FROM_ADDRESS: ${{ vars.EMAIL_FROM_ADDRESS }}
      EMAIL_MODE: ${{ vars.EMAIL_MODE }}
      VITE_API_URL: ""
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reject superseded Dev runs
        if: needs.target.outputs.environment == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" --jq '.object.sha')
          if [ "$current_sha" != "$GITHUB_SHA" ]; then
            echo "This commit is no longer the dev branch tip; deploy the newer run instead."
            exit 1
          fi
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.9
          terraform_wrapper: false
      - run: pnpm install --frozen-lockfile
      - name: Check required settings before changing infrastructure
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN}"
          : "${AWS_ACCESS_KEY_ID:?Set TF_STATE_ACCESS_KEY_ID}"
          : "${AWS_SECRET_ACCESS_KEY:?Set TF_STATE_SECRET_ACCESS_KEY}"
          : "${APP_ORIGIN:?Set APP_ORIGIN}"
          : "${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}"
          if [ "${#BETTER_AUTH_SECRET}" -lt 32 ]; then
            echo "BETTER_AUTH_SECRET must be at least 32 characters"
            exit 1
          fi
      - run: pnpm build
      - name: Exclude test environments from search indexes
        if: needs.target.outputs.environment != 'prd'
        run: |
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > apps/web/dist/_headers
      - name: Initialize the environment state
        run: |
          for attempt in 1 2 3; do
            if terraform -chdir=infra/cloudflare init -input=false -lockfile=readonly \
                -backend-config="key=accounting-app/${TF_VAR_environment}/terraform.tfstate"; then
              exit 0
            fi
            [ "$attempt" -lt 3 ] || exit 1
            wait_seconds=$((5 * 2 ** (attempt - 1)))
            [ "$wait_seconds" -le 30 ] || wait_seconds=30
            echo "Attempt $attempt failed; retrying after $wait_seconds seconds"
            sleep "$((wait_seconds + RANDOM % 3))"
          done

      - name: Plan and apply infrastructure with recovery
        run: |
          for attempt in 1 2 3; do
            if terraform -chdir=infra/cloudflare plan -lock-timeout=5m -out=deploy.tfplan &&
                terraform -chdir=infra/cloudflare apply -lock-timeout=5m deploy.tfplan; then
              exit 0
            fi
            [ "$attempt" -lt 3 ] || exit 1
            wait_seconds=$((10 * 2 ** (attempt - 1)))
            [ "$wait_seconds" -le 60 ] || wait_seconds=60
            echo "Attempt $attempt failed; retrying after $wait_seconds seconds"
            sleep "$((wait_seconds + RANDOM % 3))"
          done

      - name: Generate Wrangler configuration from Terraform outputs
        run: |
          terraform -chdir=infra/cloudflare output -json deployment > "$RUNNER_TEMP/deployment.json"
          node scripts/deployment-config.mjs "$RUNNER_TEMP/deployment.json"
      - name: Validate Worker bundle before migrations
        run: pnpm --filter server exec wrangler deploy --config wrangler.generated.json --dry-run
      - name: Apply pending D1 migrations
        run: |
          for attempt in 1 2 3; do
            if pnpm --filter server exec wrangler d1 migrations apply DB --config wrangler.generated.json --remote; then
              exit 0
            fi
            [ "$attempt" -lt 3 ] || exit 1
            wait_seconds=$((5 * 2 ** (attempt - 1)))
            [ "$wait_seconds" -le 30 ] || wait_seconds=30
            echo "Attempt $attempt failed; retrying after $wait_seconds seconds"
            sleep "$((wait_seconds + RANDOM % 3))"
          done

      - name: Prepare Worker secrets
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          DEBUG_EMAIL_DISCORD_WEBHOOK: ${{ needs.target.outputs.environment != 'prd' && secrets.DEBUG_EMAIL_DISCORD_WEBHOOK || '' }}
        run: |
          umask 077
          jq -n '{BETTER_AUTH_SECRET: env.BETTER_AUTH_SECRET} + (if env.DEBUG_EMAIL_DISCORD_WEBHOOK != "" then {DEBUG_EMAIL_DISCORD_WEBHOOK: env.DEBUG_EMAIL_DISCORD_WEBHOOK} else {} end)' > "$RUNNER_TEMP/worker-secrets.json"
      - name: Deploy Worker and frontend with secrets
        run: |
          for attempt in 1 2 3; do
            if pnpm --filter server exec wrangler deploy --config wrangler.generated.json \
                --secrets-file "$RUNNER_TEMP/worker-secrets.json"; then
              exit 0
            fi
            [ "$attempt" -lt 3 ] || exit 1
            wait_seconds=$((5 * 2 ** (attempt - 1)))
            [ "$wait_seconds" -le 30 ] || wait_seconds=30
            echo "Attempt $attempt failed; retrying after $wait_seconds seconds"
            sleep "$((wait_seconds + RANDOM % 3))"
          done

      - name: Smoke test API and frontend
        run: |
          curl_options=(--fail --silent --show-error --retry 11 --retry-all-errors --retry-delay 5 --max-time 10)
          curl "${curl_options[@]}" "$APP_ORIGIN/api/health" --output "$RUNNER_TEMP/health.json"
          jq -e '.status == "ok"' "$RUNNER_TEMP/health.json"
          curl "${curl_options[@]}" "$APP_ORIGIN" --output "$RUNNER_TEMP/frontend.html" --dump-header "$RUNNER_TEMP/frontend.headers"
          grep -qi '^content-type: text/html' "$RUNNER_TEMP/frontend.headers"
          grep -q 'id="root"' "$RUNNER_TEMP/frontend.html"
      - name: Remove temporary secrets and plans
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json" "$RUNNER_TEMP/deployment.json" infra/cloudflare/deploy.tfplan
