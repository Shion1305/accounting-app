name: Terraform plan

on:
  pull_request:
    branches: [main, dev]
    paths:
      - infra/**
      - .github/workflows/terraform-plan.yml

permissions:
  contents: read

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, stg, prd]
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.9
          terraform_wrapper: false
      - name: Install tfcmt v4.14.19
        run: |
          mkdir -p "$RUNNER_TEMP/tfcmt-bin"
          curl --fail --silent --show-error --location \
            https://github.com/suzuki-shunsuke/tfcmt/releases/download/v4.14.19/tfcmt_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/tfcmt.tar.gz"
          echo "3f6b840542bd14a981b3ca881413b79ac82c1fd79acee05cd8a5e41904fa9785  $RUNNER_TEMP/tfcmt.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/tfcmt.tar.gz" -C "$RUNNER_TEMP/tfcmt-bin" tfcmt
          echo "$RUNNER_TEMP/tfcmt-bin" >> "$GITHUB_PATH"
      - name: Initialize the environment state
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
        run: |
          : "${AWS_ACCESS_KEY_ID:?Set the repository secret TF_STATE_ACCESS_KEY_ID}"
          : "${AWS_SECRET_ACCESS_KEY:?Set the repository secret TF_STATE_SECRET_ACCESS_KEY}"
          terraform -chdir=infra/cloudflare init -input=false -lockfile=readonly \
            -backend-config="key=accounting-app/${TF_VAR_environment}/terraform.tfstate"
      - name: Plan and update the environment's PR comment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
          TFCMT_GITHUB_TOKEN: ${{ github.token }}
          TFCMT_MASKS: env:CLOUDFLARE_API_TOKEN,env:AWS_ACCESS_KEY_ID,env:AWS_SECRET_ACCESS_KEY,env:TFCMT_GITHUB_TOKEN
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set the repository secret CLOUDFLARE_API_TOKEN}"
          tfcmt -var "target:${TF_VAR_environment}" plan -patch -disable-label -- \
            terraform -chdir=infra/cloudflare plan -no-color -input=false -lock-timeout=5m
