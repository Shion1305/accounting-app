<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc"><title id="title">大学別の費目と内訳一覧</title><desc id="desc">法政、早稲田、学習院の提供書式で確認した費目を示す。立命館は通常の収支項目が自由記入。横浜国立と明治は書式未入手。</desc><style>text { font-family: 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif; }</style><rect x="0" y="0" width="1800" height="1200" rx="0" fill="#FFFFFF" stroke="none"/>
<text x="72" y="65" font-size="21" font-weight="600" fill="#235BC5" data-max-width="1656">会計データの管理項目  /  04</text>
<text x="72" y="143" font-size="53" font-weight="600" fill="#192C40" data-max-width="1656">大学別の費目・内訳一覧</text>
<text x="72" y="193" font-size="26" font-weight="400" fill="#506176" data-max-width="1656">会計データの分類を、提供書式の行に対応させるための参照表</text>
<line x1="72" y1="220" x2="1728" y2="220" stroke="#D6DFE8" stroke-width="2"/>
<rect x="72" y="250" width="804" height="492" rx="9" fill="#EDF3FD" stroke="none"/>
<text x="98" y="298" font-size="29" font-weight="600" fill="#192C40" data-max-width="752">法政  ·  支出明細の費目</text>
<text x="100" y="342" font-size="25" font-weight="400" fill="#192C40" data-max-width="748">消耗品費 / 印刷製本費 / 通信・郵便費</text>
<text x="100" y="378" font-size="25" font-weight="400" fill="#192C40" data-max-width="748">機材用具費（購入・修理）</text>
<text x="100" y="414" font-size="25" font-weight="400" fill="#192C40" data-max-width="748">演劇等舞台衣裳費（購入・レンタル・修理）</text>
<text x="100" y="450" font-size="25" font-weight="400" fill="#192C40" data-max-width="748">会場装飾費（宴会除く） / 書籍等資料購入費</text>
<text x="100" y="486" font-size="25" font-weight="400" fill="#192C40" data-max-width="748">運搬費 / 学外施設利用料 / 講師等への謝礼代</text>
<text x="100" y="522" font-size="25" font-weight="400" fill="#192C40" data-max-width="748">大会参加費（エントリー代のみ） / 外部団体登録料</text>
<text x="100" y="558" font-size="25" font-weight="400" fill="#192C40" data-max-width="748">廃液等廃棄物処理費 / 保険費 / 学祭費 / 交通費</text>
<text x="100" y="594" font-size="25" font-weight="400" fill="#192C40" data-max-width="748">宿泊・飲食代 / 贈答品</text>
<text x="100" y="630" font-size="25" font-weight="400" fill="#192C40" data-max-width="748">宴会・納会・レセプション代</text>
<text x="100" y="713" font-size="25" font-weight="600" fill="#235BC5" data-max-width="748">追加例：教材費 / サーバー維持費</text>
<rect x="908" y="250" width="820" height="492" rx="9" fill="#F2F5F8" stroke="none"/>
<text x="934" y="298" font-size="29" font-weight="600" fill="#192C40" data-max-width="768">早稲田  ·  年度収支の費目</text>
<text x="936" y="337" font-size="23" font-weight="600" fill="#235BC5" data-max-width="1656">収入</text>
<text x="1012" y="337" font-size="24" font-weight="400" fill="#192C40" data-max-width="688">サークル会費 / OB・OG等寄付金</text>
<text x="1012" y="373" font-size="24" font-weight="400" fill="#192C40" data-max-width="688">企業等協賛金 / 課外活動補助金（大学給付）</text>
<text x="1012" y="409" font-size="24" font-weight="400" fill="#192C40" data-max-width="688">その他の収入（内訳名を記入）</text>
<line x1="936" y1="437" x2="1700" y2="437" stroke="#D6DFE8" stroke-width="2"/>
<text x="936" y="475" font-size="23" font-weight="600" fill="#235BC5" data-max-width="1656">支出</text>
<text x="1012" y="475" font-size="24" font-weight="400" fill="#192C40" data-max-width="688">印刷製本費 / 消耗品費 / 用品費 / 図書資料費</text>
<text x="1012" y="511" font-size="24" font-weight="400" fill="#192C40" data-max-width="688">広告宣伝費 / 通信費 / 施設利用費</text>
<text x="1012" y="547" font-size="24" font-weight="400" fill="#192C40" data-max-width="688">宿泊費 / 交通費 / 保険料 / 賃借料</text>
<text x="1012" y="583" font-size="24" font-weight="400" fill="#192C40" data-max-width="688">講師料 / 委託費 / 医療費</text>
<text x="1012" y="619" font-size="24" font-weight="400" fill="#192C40" data-max-width="688">参加費・登録費 / 雑費</text>
<text x="1012" y="655" font-size="24" font-weight="400" fill="#192C40" data-max-width="688">その他の支出（内訳名を記入）</text>
<text x="936" y="713" font-size="23" font-weight="400" fill="#506176" data-max-width="764">「その他」は収入・支出それぞれ10行</text>
<rect x="72" y="770" width="1038" height="319" rx="9" fill="#F2F5F8" stroke="none"/>
<text x="98" y="818" font-size="29" font-weight="600" fill="#192C40" data-max-width="986">学習院  ·  費目と、必要に応じた内訳</text>
<text x="100" y="855" font-size="23" font-weight="600" fill="#235BC5" data-max-width="1656">収入</text>
<text x="176" y="855" font-size="24" font-weight="400" fill="#192C40" data-max-width="906">輔仁会予算 / 助成金 / 部費 / 合宿遠征費等個人負担金</text>
<text x="176" y="891" font-size="24" font-weight="400" fill="#192C40" data-max-width="906">OB・OG会からの補助 / 預金利子</text>
<text x="100" y="947" font-size="23" font-weight="600" fill="#235BC5" data-max-width="1656">支出</text>
<text x="176" y="947" font-size="24" font-weight="400" fill="#192C40" data-max-width="906">備品費 / 消耗品費 / 運搬費 / 交通費 / 通信費</text>
<text x="176" y="983" font-size="24" font-weight="400" fill="#192C40" data-max-width="906">連盟登録費 / 試合参加費 / 合宿遠征費 / 印刷費 / 雑費</text>
<text x="100" y="1050" font-size="24" font-weight="400" fill="#506176" data-max-width="982">内訳：助成金の種類 / 徴収月 / 大会・合宿名など</text>
<rect x="1142" y="770" width="586" height="319" rx="9" fill="#ECF6F2" stroke="none"/>
<text x="1168" y="818" font-size="29" font-weight="600" fill="#192C40" data-max-width="534">立命館  ·  収支項目は自由記入</text>
<text x="1170" y="868" font-size="25" font-weight="400" fill="#192C40" data-max-width="530">収入・支出の項目名と金額</text>
<text x="1170" y="917" font-size="25" font-weight="400" fill="#192C40" data-max-width="530">次期繰越金は現金・預金に分ける</text>
<text x="1170" y="997" font-size="23" font-weight="400" fill="#506176" data-max-width="530">横浜国立・明治は書式未入手</text>
<text x="1170" y="1036" font-size="23" font-weight="400" fill="#506176" data-max-width="530">費目や追加項目は資料取得後に確認</text>
<line x1="72" y1="1120" x2="1728" y2="1120" stroke="#D6DFE8" stroke-width="2"/>
<text x="72" y="1157" font-size="19" font-weight="400" fill="#506176" data-max-width="1656">費目名は提供サンプルに基づく。繰越金は当年度の実収入・実支出と分けて扱う。</text>
<text x="72" y="1186" font-size="17" font-weight="400" fill="#506176" data-max-width="1656">出典：大学別の会計データ管理項目一覧  ·  2026-09-27</text>
<text x="1655" y="1172" font-size="23" font-weight="600" fill="#506176" data-max-width="75">4 / 4</text></svg>