<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">AIとツールのやり取り</title><desc id="desc">図は概念的な反復。ツールの実行順や回数はモデルが決める。今回ローカル側で複数のResponsesをつないだ対話ループは実装していない。1つのResponsesの内部でCode Interpreter呼出しが反復される。ローカル評価器はファイル取得後に動作する。</desc><metadata>{&quot;date&quot;:&quot;2026-10-12&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;ランナー&quot;,&quot;href&quot;:&quot;../../../experiments/llm-export/run.ts&quot;},{&quot;label&quot;:&quot;共通の指示&quot;,&quot;href&quot;:&quot;../../../experiments/llm-export/prompt.md&quot;}]}</metadata><style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif}</style>
