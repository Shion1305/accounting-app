<text x="735" y="641" font-size="25" font-weight="400" fill="#192C40" text-anchor="start" data-max-width="775">式・パーツは保持。</text>
<text x="735" y="677" font-size="25" font-weight="400" fill="#192C40" text-anchor="start" data-max-width="775">意味が未確定の日付欄を埋めてしまい不合格。</text>
<text x="64" y="751" font-size="32" font-weight="600" fill="#975B11" text-anchor="start" data-max-width="1472">4回とも「合格・完了」の全条件には到達しなかった</text>
<text x="64" y="780" font-size="23" font-weight="400" fill="#506176" text-anchor="start" data-max-width="1472">各条件・各書式1回だけの観察。主比較の成功率へ混ぜず、改善率の推定にも使わない。</text>
