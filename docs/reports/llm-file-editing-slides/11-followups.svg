<text x="64" y="122" font-size="48" font-weight="600" fill="#192C40" text-anchor="start" data-max-width="1472">追加条件でも、課題が残った</text>
<text x="64" y="169" font-size="26" font-weight="400" fill="#506176" text-anchor="start" data-max-width="1472">失敗ケースに対する新規試行を4回。前回の成果物や履歴は渡していない</text>
