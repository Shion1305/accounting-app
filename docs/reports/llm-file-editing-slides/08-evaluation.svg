<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">合格と完了を分けて確認</title><desc id="desc">静的な合格は、Excel互換性・表示・提出品質の完全な保証ではない。応答完了判定は最終説明の全要件を自動採点したものでもない。3つの狭い期待値条件を修正し、結合セル内の非表示入力や名前空間の不備などの見落としも修正した。すべての元成果物と訂正履歴を保持した。</desc><metadata>{&quot;date&quot;:&quot;2026-10-12&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;検証結果&quot;,&quot;href&quot;:&quot;../llm-file-editing-poc-2026-10-12.md&quot;},{&quot;label&quot;:&quot;集計JSON&quot;,&quot;href&quot;:&quot;../../../experiments/llm-export/results/2026-10-12/summary.json&quot;}]}</metadata><style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif}</style>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#FFFFFF" stroke="none"/>
<text x="64" y="51" font-size="20" font-weight="600" fill="#235BC5" text-anchor="start" data-max-width="1472">LLMによる会計帳票編集  /  評価</text>
<text x="64" y="122" font-size="48" font-weight="600" fill="#192C40" text-anchor="start" data-max-width="1472">合格と完了を分けて確認</text>
<text x="64" y="169" font-size="26" font-weight="400" fill="#506176" text-anchor="start" data-max-width="1472">ファイル内の値だけで、成功とは判定しない</text>
<line x1="64" y1="194" x2="1536" y2="194" stroke="#D6DFE8" stroke-width="2"/>
<rect x="64" y="245" width="676" height="383" rx="8" fill="#EDF3FD" stroke="none"/>
<text x="90" y="296" font-size="36" font-weight="600" fill="#235BC5" text-anchor="start" data-max-width="624">静的合格</text>
<text x="90" y="354" font-size="28" font-weight="600" fill="#192C40" text-anchor="start" data-max-width="600">内容</text>
<text x="90" y="397" font-size="27" font-weight="400" fill="#192C40" text-anchor="start" data-max-width="624">金額・分類・識別番号・明細など</text>
<line x1="90" y1="427" x2="714" y2="427" stroke="#D6DFE8" stroke-width="2"/>
<text x="90" y="475" font-size="28" font-weight="600" fill="#192C40" text-anchor="start" data-max-width="600">構造と保持</text>
<text x="90" y="519" font-size="26" font-weight="400" fill="#192C40" text-anchor="start" data-max-width="624">数式・対象外シート・図形・コメント</text>
<text x="90" y="562" font-size="26" font-weight="400" fill="#192C40" text-anchor="start" data-max-width="624">入力規則・印刷設定・XMLの整合性</text>
<rect x="788" y="245" width="748" height="383" rx="8" fill="#ECF6F2" stroke="none"/>
<text x="814" y="296" font-size="36" font-weight="600" fill="#147968" text-anchor="start" data-max-width="696">完了した成果物</text>
<circle cx="838" cy="350" r="21" fill="#147968"/>
<text x="838" y="359" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle" data-max-width="40">1</text>
<text x="879" y="359" font-size="28" font-weight="400" fill="#192C40" text-anchor="start" data-max-width="631">提供元の応答が completed</text>
<circle cx="838" cy="417" r="21" fill="#147968"/>
<text x="838" y="426" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle" data-max-width="40">2</text>
<text x="879" y="426" font-size="28" font-weight="400" fill="#192C40" text-anchor="start" data-max-width="631">空でない最終回答も完了</text>
<circle cx="838" cy="484" r="21" fill="#147968"/>
<text x="838" y="493" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle" data-max-width="40">3</text>
<text x="879" y="493" font-size="28" font-weight="400" fill="#192C40" text-anchor="start" data-max-width="631">Excelを取得できる</text>
<circle cx="838" cy="551" r="21" fill="#147968"/>
<text x="838" y="560" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle" data-max-width="40">4</text>
<text x="879" y="560" font-size="28" font-weight="400" fill="#192C40" text-anchor="start" data-max-width="631">独立した静的検査に合格</text>
<text x="64" y="689" font-size="30" font-weight="600" fill="#192C40" text-anchor="start" data-max-width="1472">Excelで開く・再計算する・印刷する確認は、さらに別の検証</text>
<text x="64" y="744" font-size="23" font-weight="400" fill="#506176" text-anchor="start" data-max-width="1472">評価器は出力を見た後に訂正した。元の評価を残し、全取得済み成果物へ同じ基準を適用。</text>
<text x="64" y="779" font-size="23" font-weight="400" fill="#506176" text-anchor="start" data-max-width="1472">事前に完全固定したベンチマークではない点も、結果の限界として記録した。</text>
<line x1="64" y1="822" x2="1536" y2="822" stroke="#D6DFE8" stroke-width="2"/>
<text x="64" y="858" font-size="18" font-weight="400" fill="#506176" text-anchor="start" data-max-width="1472">2026-10-12  /  会計帳票の直接編集 PoC</text>
<text x="1536" y="858" font-size="21" font-weight="600" fill="#506176" text-anchor="end" data-max-width="90">08 / 14</text>
</svg>
